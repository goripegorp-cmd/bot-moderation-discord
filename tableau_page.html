<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<title>Espace direction</title>
<style>
:root{
  --fond:#05070d;--fond-2:#0a0f1c;--fond-3:#0f1626;
  --s1:rgba(148,163,184,.055);--s2:rgba(148,163,184,.09);--s3:rgba(148,163,184,.14);
  --b1:rgba(148,163,184,.13);--b2:rgba(148,163,184,.22);--b3:rgba(148,163,184,.34);
  --t1:#eef3fb;--t2:#bcc7d8;--t3:#8f9cb3;
  --cyan:#22d3ee;--bleu:#3b82f6;--indigo:#818cf8;--violet:#a78bfa;--vert:#34d399;--rouge:#fb7185;--ambre:#fbbf24;--gris:#94a3b8;
  --r1:10px;--r2:14px;--r3:18px;--r4:24px;
  --ombre:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -18px rgba(0,0,0,.7);
  --ease:cubic-bezier(.22,.9,.24,1);--ressort:cubic-bezier(.34,1.36,.64,1);
  --g:clamp(12px,3.4vw,24px);--entete:112px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip;scroll-padding-top:calc(var(--entete) + 8px)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--t1);background:var(--fond);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img{display:block}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* Fond vivant, léger (transform seulement) */
.aurore{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurore i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;opacity:.5;will-change:transform}
.aurore i:nth-child(1){top:-48vmax;left:-28vmax;background:radial-gradient(closest-side,rgba(8,145,178,.45),transparent);animation:derive 26s var(--ease) infinite alternate}
.aurore i:nth-child(2){top:-44vmax;right:-34vmax;background:radial-gradient(closest-side,rgba(79,70,229,.42),transparent);animation:derive 32s var(--ease) infinite alternate-reverse}
.aurore i:nth-child(3){bottom:-60vmax;left:10vmax;background:radial-gradient(closest-side,rgba(37,99,235,.18),transparent);animation:derive 38s var(--ease) infinite alternate}
@keyframes derive{to{transform:translate3d(6vmax,5vmax,0) scale(1.08)}}

.app{max-width:1320px;margin:0 auto;padding:0 var(--g) 80px}

/* En-tête collant */
.entete{position:sticky;top:0;z-index:30;margin:0 calc(var(--g) * -1);padding:max(10px,env(safe-area-inset-top)) var(--g) 0;
  background:rgba(5,7,13,.86);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid var(--b1)}
.barre{display:flex;align-items:center;gap:10px;min-height:48px}
.marque{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{flex:none;width:40px;height:40px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,var(--cyan),var(--bleu));box-shadow:0 8px 22px -6px rgba(37,99,235,.6)}
.logo img{width:100%;height:100%;object-fit:cover}
.titre{min-width:0;line-height:1.2}
.titre b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titre small{display:block;font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.direct{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:999px;background:var(--s1);border:1px solid var(--b1);
  font-size:12px;color:var(--t2);white-space:nowrap;flex:none}
.point{width:8px;height:8px;border-radius:50%;background:var(--vert);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pouls 2.4s infinite}
.point.panne{background:var(--ambre);animation:none}
@keyframes pouls{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.rafraichir{position:relative;width:32px;height:32px;border-radius:50%;border:0;background:var(--s2);display:grid;place-items:center;cursor:pointer;color:var(--t1);flex:none}
.rafraichir:hover{background:var(--s3)}
.rafraichir svg.anneau{position:absolute;inset:0;width:32px;height:32px;transform:rotate(-90deg)}
.anneau circle{fill:none;stroke-width:2.4}
.anneau .fond-a{stroke:rgba(148,163,184,.18)}
.anneau .plein-a{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:88;stroke-dashoffset:88}
.anneau .plein-a.court{animation:anneau linear forwards;animation-duration:var(--duree,60s)}
@keyframes anneau{from{stroke-dashoffset:0}to{stroke-dashoffset:88}}
.rafraichir.tourne>svg:not(.anneau){animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.cacher-mobile{display:inline}
@media (max-width:520px){.cacher-mobile{display:none}.direct{padding:4px}}

/* Onglets */
.onglets{position:relative;display:flex;gap:2px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:8px 2px 10px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.onglets::-webkit-scrollbar{display:none}
.onglet{position:relative;z-index:1;flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border:0;border-radius:11px;background:none;
  color:var(--t2);font-weight:650;font-size:14px;cursor:pointer;white-space:nowrap;transition:color .2s}
.onglet:hover{color:var(--t1)}
.onglet[aria-selected="true"]{color:var(--t1)}
.curseur{position:absolute;z-index:0;left:0;top:8px;height:calc(100% - 18px);width:0;border-radius:11px;pointer-events:none;
  background:linear-gradient(135deg,rgba(34,211,238,.20),rgba(99,102,241,.24));box-shadow:inset 0 0 0 1px rgba(125,211,252,.28);
  transition:transform .5s var(--ressort),width .5s var(--ressort)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--s3);font-size:11px;font-weight:700;display:inline-grid;place-items:center;color:var(--t2)}
.badge.chaud{background:rgba(251,113,133,.2);color:#fecdd3}

/* Bandeaux */
.bandeau{margin-top:14px;padding:12px 14px;border-radius:var(--r2);display:flex;gap:10px;align-items:flex-start;font-size:14px;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);color:#fde68a}
.bandeau.rouge{background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.4);color:#fecdd3}
.bandeau svg{flex:none;margin-top:2px}

/* Vues */
.vue{display:grid;gap:22px;padding-top:20px;min-width:0}
.vue>*{min-width:0}
.vue.anim{animation:vue .5s var(--ease) both}
@keyframes vue{from{opacity:0;transform:translateY(10px)}}

.section{display:grid;gap:12px;min-width:0}
.section-tete{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;min-width:0}
.section-tete h2{margin:0;font-size:16px;font-weight:750;display:flex;align-items:center;gap:8px;min-width:0}
.section-tete h2 svg{color:var(--cyan);flex:none}
.compte{font-size:12px;color:var(--t3)}
.aide{margin:0;color:var(--t3);font-size:13px}

/* Tuiles */
.tuiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.tuile{position:relative;overflow:hidden;padding:14px 16px 13px;border-radius:var(--r3);background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--b1);min-width:0}
.tuile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--teinte,var(--cyan))}
.tuile::after{content:"";position:absolute;right:-40px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:radial-gradient(closest-side,var(--teinte,var(--cyan)),transparent);opacity:.16}
.tuile.lien{cursor:pointer;transition:transform .3s var(--ease),border-color .3s}
.tuile.lien:hover{transform:translateY(-2px);border-color:var(--b2)}
.tuile .val{font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tuile .lib{font-size:13px;color:var(--t2);margin-top:3px}
.tuile .sous{font-size:12px;color:var(--t3);margin-top:6px;overflow-wrap:anywhere}

/* Cartes */
.grille{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));align-items:start}
.grille.etroite{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.grille.mosaique{display:flex;align-items:flex-start;gap:12px}
.grille.mosaique>.colonne{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px}
.carte{position:relative;min-width:0;padding:16px;border-radius:var(--r3);background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--b1);box-shadow:var(--ombre)}
.carte.lien{cursor:pointer;transition:transform .3s var(--ease),border-color .3s,background .3s}
.carte.lien:hover{transform:translateY(-2px);border-color:var(--b2);background:linear-gradient(180deg,var(--s3),var(--s1))}
.carte.alerte{border-color:rgba(251,113,133,.42);background:linear-gradient(180deg,rgba(251,113,133,.09),var(--s1))}
.carte.chaude{border-color:rgba(251,191,36,.42)}
.anime>.carte,.anime>.colonne>.carte,.anime>.ligne,.anime>.evt{animation:monte .5s var(--ease) both;animation-delay:calc(var(--i,0) * 32ms)}
.carte{transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
@media (hover:hover){.carte:hover{border-color:var(--b2);box-shadow:var(--ombre),0 18px 40px -24px rgba(34,211,238,.35)}}
.intro{display:flex;align-items:center;gap:14px;min-width:0;animation:monte .5s var(--ease) both}
.intro .icone-onglet{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--teinte,var(--cyan)),rgba(99,102,241,.85));box-shadow:0 10px 26px -10px var(--teinte,var(--cyan))}
.intro h1{margin:0;font-size:clamp(20px,4.2vw,26px);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.intro p{margin:3px 0 0;color:var(--t2);font-size:14px}
@keyframes monte{from{opacity:0;transform:translateY(10px) scale(.985)}}
.pile{display:grid;gap:12px;min-width:0}
.cadre{min-width:0;padding:18px;border-radius:var(--r3);background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--b1)}
.cadre h3{margin:0 0 4px;font-size:15px}
.duo{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}

/* Personnes */
.qui{display:flex;align-items:center;gap:12px;min-width:0}
.qui .bloc{min-width:0;flex:1}
.nom{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.sous-nom{font-size:12px;color:var(--t3);overflow-wrap:anywhere}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#334155,#1e293b);display:grid;place-items:center;font-weight:750;font-size:14px;color:#cbd5e1}
.avatar.p{width:32px;height:32px;font-size:12px}
.avatar.xs{width:24px;height:24px;font-size:10px}
.avatar.g{width:64px;height:64px;font-size:22px}

/* Pastilles, puces, boutons */
.pastilles{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pastille{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--teinte,var(--t2));background:rgba(148,163,184,.1);background:color-mix(in srgb,var(--teinte,#94a3b8) 14%,transparent);border:1px solid color-mix(in srgb,var(--teinte,#94a3b8) 32%,transparent)}
.pastille.point-av::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--b1);background:var(--s1);font-size:13px;cursor:pointer;color:var(--t2);transition:background .2s,border-color .2s,color .2s;max-width:100%}
.puce:hover{color:var(--t1);border-color:var(--b2)}
.puce i{width:8px;height:8px;border-radius:50%;background:var(--teinte,var(--cyan));flex:none}
.puce[aria-pressed="true"]{color:var(--t1);border-color:var(--teinte,var(--cyan));background:color-mix(in srgb,var(--teinte,#22d3ee) 16%,transparent)}
.puce .n{color:var(--t3);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.bouton{display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%;min-height:36px;padding:7px 13px;border-radius:11px;border:1px solid var(--b2);background:var(--s2);
  color:var(--t1);font-size:13px;font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,transform .15s,border-color .2s}
.bouton:hover{background:var(--s3);border-color:var(--b3)}
.bouton:active{transform:scale(.97)}
.bouton:disabled{opacity:.5;cursor:not-allowed}
.bouton.principal{background:linear-gradient(135deg,var(--cyan),var(--bleu));border-color:transparent;color:#03111e}
.bouton.principal:hover{filter:brightness(1.08)}
.bouton.danger{color:#fecdd3;border-color:rgba(251,113,133,.45);background:rgba(251,113,133,.12)}
.bouton.danger:hover{background:rgba(251,113,133,.2)}
.bouton.vert{color:#bbf7d0;border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.12)}
.bouton.discret{background:none;border-color:transparent;color:var(--t2)}
.bouton.discret:hover{background:var(--s2);color:var(--t1)}
.bouton.p{min-height:30px;padding:4px 10px;font-size:12px;border-radius:9px}
.lien-nom{border:0;background:none;padding:0;font:inherit;color:#7dd3fc;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.lien-nom:hover{text-decoration:underline}
.copier{border:0;background:none;color:var(--t3);cursor:pointer;padding:3px;border-radius:7px;display:inline-grid;place-items:center;vertical-align:middle}
.copier:hover{color:var(--t1);background:var(--s2)}
.ident{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;color:var(--t3);overflow-wrap:anywhere}

/* Barre d'outils */
.outils{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.recherche{flex:1 1 230px;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px;min-height:40px;border-radius:12px;background:var(--s1);border:1px solid var(--b1)}
.recherche:focus-within{border-color:var(--b3)}
.recherche input{flex:1;min-width:0;border:0;outline:0;background:none;padding:8px 0}
.recherche svg{color:var(--t3);flex:none}
select{min-height:40px;max-width:100%;padding:0 12px;border-radius:12px;background:var(--fond-3);border:1px solid var(--b1)}
.segment{display:inline-flex;padding:3px;border-radius:12px;background:var(--s1);border:1px solid var(--b1)}
.segment button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:650;color:var(--t2);cursor:pointer;white-space:nowrap}
.segment button[aria-pressed="true"]{background:var(--s3);color:var(--t1)}
.bascule{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);cursor:pointer;user-select:none}
.bascule input{accent-color:var(--rouge);width:16px;height:16px}

/* Listes d'entrées (dans une carte) */
.entrees{display:grid;gap:6px;margin:0;padding:0;list-style:none;min-width:0}
.entree{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:9px 11px;border-radius:12px;background:var(--s1);border:1px solid var(--b1);min-width:0}
.entree .haut{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0;flex-wrap:wrap}
.entree .quoi{font-weight:650;font-size:13px;overflow-wrap:anywhere}
.entree .quand{font-size:12px;color:var(--t3);white-space:nowrap;font-variant-numeric:tabular-nums}
.entree .texte{font-size:13px;color:var(--t2);overflow-wrap:anywhere}
.entree .meta{font-size:12px;color:var(--t3);overflow-wrap:anywhere}
.entree.grave{border-color:rgba(251,113,133,.38);background:rgba(251,113,133,.06)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.deplier{cursor:pointer}
.deplier.ouvert{-webkit-line-clamp:unset;display:block}

/* Fil chronologique */
.fil{display:grid;gap:16px;min-width:0}
.jour{display:grid;gap:8px;min-width:0}
.jour-titre{position:sticky;top:calc(var(--entete) + 6px);z-index:2;justify-self:start;padding:4px 11px;border-radius:999px;background:var(--fond-3);border:1px solid var(--b2);font-size:12px;font-weight:750;color:var(--t2)}
.evt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--b1);min-width:0}
.evt.grave{border-color:rgba(251,113,133,.4);background:linear-gradient(90deg,rgba(251,113,133,.09),var(--s1) 45%)}
.evt .corps-e{min-width:0;display:grid;gap:3px}
.evt .ligne1{display:flex;align-items:baseline;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.evt .texte{overflow-wrap:anywhere}
.evt .meta{font-size:12px;color:var(--t3);overflow-wrap:anywhere}

/* Lignes compactes */
.lignes{display:grid;gap:8px;min-width:0}
.ligne{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--b1);min-width:0}
.ligne .droite{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.ligne.choisie{border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.07)}
@media (max-width:560px){.ligne{grid-template-columns:auto minmax(0,1fr)}.ligne .droite{grid-column:1/-1;justify-content:flex-start}}
.coche{width:18px;height:18px;accent-color:var(--rouge);flex:none}

/* Jauge 7 jours */
.jauge{display:inline-flex;gap:3px;vertical-align:middle}
.jauge span{width:8px;height:14px;border-radius:3px;background:rgba(148,163,184,.18)}
.jauge span.on{background:var(--teinte,var(--vert))}

/* Graphiques */
.graphe svg{width:100%;height:auto;display:block}
.graphe text{fill:var(--t3);font-size:11px}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--t2);margin-top:10px}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{width:10px;height:10px;border-radius:3px;display:inline-block}
.barre-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,2fr) auto;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.barre-h .lib{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.barre-h .fond{height:9px;border-radius:999px;background:rgba(148,163,184,.14);overflow:hidden}
.barre-h .plein{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--bleu));transform-origin:left;animation:pousse .9s var(--ease) both}
.question-sondage{margin:12px 0 4px;font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.salon-ligne{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--b1);min-width:0}
.salon-ligne:last-child{border-bottom:0}
.salon-ligne .nom-salon{min-width:0;overflow-wrap:anywhere;font-size:13px;color:var(--t2)}
.salon-ligne .droite{flex:none}
.choix-sondage{margin:10px 0}
.choix-sondage .haut-choix{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--t2)}
.choix-sondage .haut-choix span{min-width:0;overflow-wrap:anywhere}

    if (r.status === 403) { expire(); return; }
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();
    etat.etag = r.headers.get("ETag"); etat.d = d; etat.dernier = Date.now(); etat.erreurs = 0;
    if (d.version && d.version !== VERSION) etat.versionNeuve = true;

  } catch (e) {
    etat.erreurs++;

});
$("#rafraichir").addEventListener("click", () => charger());
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#dialogue-hote").firstChild) fermerFiche(); });

/* ── Démarrage ─────────────────────────────────────────────────────────── */
(async () => {
  const ancre = lireAncre();
  if (ancre.onglet && ONGLETS.some(o => o[0] === ancre.onglet)) etat.onglet = ancre.onglet;
  monterOnglets();
  $("#vue-" + etat.onglet).append(h("div", {classe: "tuiles"}, [1, 2, 3, 4].map(() => h("div", {classe: "squelette", style: "height:98px"}))),
    h("div", {classe: "squelette", style: "height:340px"}));
  await charger();
  let retour = null;
  try { retour = JSON.parse(sessionStorage.getItem("tableau.retour") || "null"); sessionStorage.removeItem("tableau.retour"); } catch (e) { retour = null; }
  if (retour && retour.onglet === etat.onglet && retour.y) requestAnimationFrame(() => scrollTo({top: retour.y}));
  if (ancre.membre && etat.d) ouvrirFiche(ancre.membre); else majAncre();
})();
</script>
</body>
</html>
