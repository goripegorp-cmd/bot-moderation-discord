<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2f1d10">
<meta name="description" content="La Capitainerie : le livre de bord du fondateur et de la direction.">
<title>La Capitainerie</title>
<link rel="manifest" href="/tableau/espace/s/manifest.webmanifest?v={{V}}">
<link rel="icon" type="image/png" sizes="192x192" href="/tableau/espace/s/app-192.png?v={{V}}">
<link rel="apple-touch-icon" href="/tableau/espace/s/app-192.png?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/polices/polices.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/style.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/composants.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/pieces.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/ateliers.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/rangement.css?v={{V}}">
<script type="module" src="/tableau/espace/s/app.js?v={{V}}"></script>
</head>
<body class="demarrage">
<a class="evitement" href="#contenu">Aller au contenu</a>
<div id="sprite-hote" class="sprite-hote" aria-hidden="true"></div>

<header class="entete" id="entete">
  <div class="planche">
    <div class="marque">
      <span class="medaillon" id="logo-serveur" aria-hidden="true"></span>
      <span class="medaillon medaillon-jeu" id="logo-jeu" aria-hidden="true" hidden></span>
      <div class="marque-texte">
        <span class="marque-nom" id="nom-serveur">La Capitainerie</span>
        <span class="marque-sous" id="sous-titre">Ouverture du livre de bord…</span>
      </div>
    </div>
    <div class="entete-outils" id="entete-outils"></div>
  </div>
  <nav class="pancartes" id="pancartes" aria-label="Catégories"></nav>
</header>

<div class="feuille" id="feuille">
  <span class="coin coin-hg" aria-hidden="true"></span><span class="coin coin-hd" aria-hidden="true"></span>
  <span class="coin coin-bg" aria-hidden="true"></span><span class="coin coin-bd" aria-hidden="true"></span>
  <nav class="rubriques" id="rubriques" aria-label="Rubriques"></nav>
  <div class="bandeaux" id="bandeaux"></div>
  <main class="contenu" id="contenu" tabindex="-1">
    <div class="attente-depart" id="attente-depart">
      <span class="attente-boussole" aria-hidden="true"></span>
      <p>Ouverture du livre de bord…</p>
    </div>
  </main>
  <footer class="pied" id="pied"></footer>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><p class="sans-script">La Capitainerie a besoin de JavaScript pour s'ouvrir.</p></noscript>
</body>
</html>
