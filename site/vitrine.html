<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#a8823f">
<title>{{OG_TITRE}}</title>
<meta name="description" content="{{OG_DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="{{OG_SITE}}">
<meta property="og:title" content="{{OG_TITRE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:url" content="{{OG_URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITRE}}">
<meta name="twitter:description" content="{{OG_DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">
<link rel="icon" type="image/png" sizes="192x192" href="/tableau/espace/s/app-192.png?v={{V}}">
<link rel="apple-touch-icon" href="/tableau/espace/s/app-192.png?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/polices/polices.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/style.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/composants.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/pieces.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/ateliers.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/equipage.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/banniere.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/vitrine.css?v={{V}}">
<script type="module" src="/tableau/espace/s/vitrine.js?v={{V}}"></script>
</head>
<body class="demarrage page-equipage page-vitrine">
<a class="evitement" href="#contenu">Aller au contenu</a>
<div id="sprite-hote" class="sprite-hote" aria-hidden="true"></div>

<header class="entete" id="entete">
  <div class="planche">
    <div class="marque">
      <span class="medaillon" id="logo-serveur" aria-hidden="true"></span>
      <div class="marque-texte">
        <span class="marque-nom" id="nom-serveur">{{TITRE}}</span>
        <span class="marque-sous" id="sous-titre">{{SOUS_TITRE}}</span>
      </div>
    </div>
    <div class="entete-outils" id="entete-outils"></div>
  </div>
</header>

<div class="feuille" id="feuille">
  <span class="coin coin-hg" aria-hidden="true"></span><span class="coin coin-hd" aria-hidden="true"></span>
  <span class="coin coin-bg" aria-hidden="true"></span><span class="coin coin-bd" aria-hidden="true"></span>
  <main class="contenu" id="contenu" tabindex="-1">
    <div class="attente-depart" id="attente-depart">
      <span class="attente-boussole" aria-hidden="true"></span>
      <p>Le pavillon se hisse…</p>
    </div>
  </main>
  <footer class="pied" id="pied"></footer>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><p class="sans-script">La vitrine de l'équipage a besoin de JavaScript pour s'ouvrir.</p></noscript>
</body>
</html>
