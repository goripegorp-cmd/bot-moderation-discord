<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2f1d10">
<meta name="description" content="Le questionnaire de candidature du clan, étape par étape.">
<title>Questionnaire de candidature</title>
<link rel="icon" type="image/png" sizes="192x192" href="/tableau/espace/s/app-192.png?v={{V}}">
<link rel="apple-touch-icon" href="/tableau/espace/s/app-192.png?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/polices/polices.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/style.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/composants.css?v={{V}}">
<link rel="stylesheet" href="/tableau/espace/s/candidature.css?v={{V}}">
<script type="module" src="/tableau/espace/s/candidature.js?v={{V}}"></script>
</head>
<body class="demarrage page-candidature">
<a class="evitement" href="#contenu">Aller au contenu</a>
<div id="sprite-hote" class="sprite-hote" aria-hidden="true"></div>

<header class="entete" id="entete">
  <div class="planche">
    <div class="marque">
      <span class="medaillon" id="logo-serveur" aria-hidden="true"></span>
      <div class="marque-texte">
        <span class="marque-nom" id="nom-page">Questionnaire de candidature</span>
        <span class="marque-sous" id="sous-titre">Ouverture du questionnaire…</span>
      </div>
    </div>
  </div>
</header>

<div class="feuille" id="feuille">
  <span class="coin coin-hg" aria-hidden="true"></span><span class="coin coin-hd" aria-hidden="true"></span>
  <span class="coin coin-bg" aria-hidden="true"></span><span class="coin coin-bd" aria-hidden="true"></span>
  <main class="contenu" id="contenu" tabindex="-1">
    <div class="attente-depart" id="attente-depart">
      <span class="attente-boussole" aria-hidden="true"></span>
      <p>Ouverture du questionnaire…</p>
    </div>
  </main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><p class="sans-script">Le questionnaire a besoin de JavaScript pour s'ouvrir.</p></noscript>
</body>
</html>
